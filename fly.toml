# fly.toml app configuration file generated for hamcal on 2026-07-20T14:09:12-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hamcal'
primary_region = 'dfw'

[build]
[env]
  EVENTS_DB = '/data/hamcal.db'

[[mounts]]
  source = 'hamcal_data'
  destination = '/data'

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
